name: Update RSS Feeds

on:
schedule:
- cron: "*/15 * * * *"
workflow_dispatch:

permissions:
contents: write

jobs:
update-rss:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout Repo
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Install Dependencies
    run: |
      pip install requests beautifulsoup4 lxml python-dateutil

  - name: Generate Jagran RSS
    run: |
      python generate_rss.py "https://www.jagran.com/uttar-pradesh" -o jagran.xml

  - name: Generate Bhaskar RSS
    run: |
      python generate_rss.py "https://www.bhaskar.com/local/uttar-pradesh/" -o bhaskar.xml

  - name: Commit Changes
    run: |
      git config --global user.name "github-actions"
      git config --global user.email "github-actions@github.com"

      git add jagran.xml bhaskar.xml

      git commit -m "Auto update RSS" || echo "No changes"

      git push
```
